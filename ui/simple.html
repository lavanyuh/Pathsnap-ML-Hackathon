
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PathSnap - Route Reconstruction</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f8;
            color: #222;
        }

        header {
            background: #172554;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .panel {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        input, select, button {
            padding: 11px;
            margin: 7px 4px 7px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #map {
            height: 480px;
            border-radius: 10px;
        }

        #status {
            margin-top: 12px;
            font-weight: bold;
        }

        pre {
            background: #f1f5f9;
            padding: 15px;
            overflow-x: auto;
        }

    </style>
</head>

<body>

<header>
    <h1>PathSnap</h1>
    <p>Distributed Map Matching and Route Reconstruction</p>
</header>

<div class="container">

    <div class="panel">

        <h2>Connect to API</h2>

        <input
            id="apiUrl"
            type="text"
            value="http://127.0.0.1:8000"
            style="width: 70%;"
        >

        <button onclick="loadTrips()">
            Connect
        </button>

        <p id="status">Not connected</p>

    </div>


    <div class="panel">

        <h2>Select Trip</h2>

        <select id="tripSelect">
            <option value="">Connect to load trips</option>
        </select>

        <button onclick="predictTrip()">
            Reconstruct Route
        </button>

    </div>


    <div class="panel">

        <h2>Route Map</h2>

        <div id="map"></div>

    </div>


    <div class="panel">

        <h2>Prediction Results</h2>

        <pre id="results">No prediction requested.</pre>

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    const map = L.map("map").setView([20, 0], 2);

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution: "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);

    let routeLayer = null;
    let gpsLayer = null;


    function getApiUrl() {

        return document
            .getElementById("apiUrl")
            .value
            .trim()
            .replace(/\/$/, "");

    }


    async function loadTrips() {

        const status = document.getElementById("status");

        try {

            const response = await fetch(
                getApiUrl() + "/trips"
            );

            if (!response.ok) {
                throw new Error("Could not load trips");
            }

            const data = await response.json();

            const select = document.getElementById("tripSelect");

            select.innerHTML = "";

            data.trips.forEach(id => {

                const option = document.createElement("option");

                option.value = id;
                option.textContent = id;

                select.appendChild(option);

            });

            status.textContent =
                "Connected! " + data.trips.length + " trips loaded.";

        }

        catch (error) {

            status.textContent = "Connection failed: " + error.message;

        }

    }


    async function predictTrip() {

        const tripId = document.getElementById("tripSelect").value;

        if (!tripId) {
            alert("Please select a trip.");
            return;
        }

        document.getElementById("status").textContent =
            "Requesting prediction...";

        try {

            const response = await fetch(
                getApiUrl() + "/predict",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        trip_id: tripId
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "Prediction failed");
            }

            document.getElementById("results").textContent =
                JSON.stringify(data, null, 4);

            document.getElementById("status").textContent =
                data.status;

            // Remove previous layers.

            if (routeLayer) {
                map.removeLayer(routeLayer);
            }

            if (gpsLayer) {
                map.removeLayer(gpsLayer);
            }

            // Coordinates are expected as [longitude, latitude].

            const gps = data.gps_points || [];

            if (gps.length > 0) {

                const latLngs = gps.map(
                    point => [point[1], point[0]]
                );

                gpsLayer = L.polyline(
                    latLngs,
                    {
                        color: "blue",
                        weight: 3
                    }
                ).addTo(map);

                map.fitBounds(gpsLayer.getBounds());

            }

            const route = data.predicted_route || [];

            if (route.length > 0) {

                const routeCoordinates = route.map(
                    point => [point[1], point[0]]
                );

                routeLayer = L.polyline(
                    routeCoordinates,
                    {
                        color: "red",
                        weight: 5
                    }
                ).addTo(map);

                map.fitBounds(routeLayer.getBounds());

            }

        }

        catch (error) {

            document.getElementById("status").textContent =
                error.message;

        }

    }

</script>

</body>
</html>
